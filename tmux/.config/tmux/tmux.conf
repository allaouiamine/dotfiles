unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g prefix C-a

set -g base-index 1
set -g mouse on
set-option -g status-position top
set-window-option -g mode-keys vi

# Copy to the macOS clipboard with pbcopy rather than forwarding OSC 52 to
# Alacritty: two writers racing on NSPasteboard made Alacritty warn
# "NSPasteboard#writeObjects: returned false".
set -s set-clipboard off
set -s copy-command 'pbcopy'


bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

unbind %
bind | split-window -h 

unbind '"'
bind - split-window -v

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'omerxx/tmux-floax'

set -g @floax-bind 'p'
set -g @floax-width '80%'
set -g @floax-height '80%'
set -g @floax-border-color 'magenta'
set -g @floax-text-color 'blue'
set -g @floax-change-path 'true'

# --- catppuccin -------------------------------------------------------------
# Installed manually (not via tpm) as upstream recommends: tpm would clone it
# to plugins/tmux/ and clash on the directory name.
#   git clone -b v2.3.0 https://github.com/catppuccin/tmux.git \
#     ~/.config/tmux/plugins/catppuccin/tmux
# Update = fetch + checkout a newer tag in that directory.

set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_status_background "#{@thm_bg}"

# windows: rounded pills, window number on the right
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_text "#W"
set -g @catppuccin_window_number "#[fg=#{@thm_surface_0}]#I"
set -g @catppuccin_window_number_color "#{@thm_blue}"
set -g @catppuccin_window_current_text "#W#{?window_zoomed_flag,(),}"
set -g @catppuccin_window_current_number "#[fg=#{@thm_bg}]#I"
set -g @catppuccin_window_current_text_color "#{@thm_bg}"
set -g @catppuccin_window_current_number_color "#{@thm_peach}"

# status modules: session on the left, directory on the right
set -g @catppuccin_status_left_separator " "
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_session_icon_fg "#{@thm_bg}"
set -g @catppuccin_status_directory_icon_fg "#{@thm_bg}"
set -g @catppuccin_directory_color "#{@thm_pink}"
# set explicitly so a reload over a server that still has the old fork's
# @catppuccin_* options set does not inherit its value (v2 keeps pre-set ones)
set -g @catppuccin_directory_text " #{b:pane_current_path}"

# panes
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g @catppuccin_pane_active_border_style "fg=#{@thm_blue}"

run '~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux'

# --- everything below must stay after the catppuccin run --------------------

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -g status-left-length 100
set -g status-right-length 100
set -g window-status-separator " "

# tmux draws the prompt over a *copy* of the status line and only paints its
# own background where `fill=` is given (prompt.c: `if (sy.fill != 8)`), so
# without it the status pills show through whatever you type. catppuccin ships
# `align=centre` and no fill, which is what mangled the prompt. Keep the
# colours, drop the centring, add the fill.
set -gF message-style "fg=#{@thm_sky},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"
set -gF message-command-style "fg=#{@thm_sky},bg=#{@thm_surface_0},fill=#{@thm_surface_0}"

# v2 themes a few things the old fork left alone; keep the previous look.
set -gF mode-style "fg=#{@thm_pink},bg=#{@thm_surface_2},bold"
set -g window-status-bell-style "reverse"
set -g popup-style default
set -g popup-border-style default
set -g menu-selected-style "bg=yellow,fg=black"

set-environment -gF TMUX_PLUGIN_MANAGER_PATH '#{HOME}/.config/tmux/plugins/'
run '~/.config/tmux/plugins/tpm/tpm'
